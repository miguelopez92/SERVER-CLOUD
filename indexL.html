<!DOCTYPE html>
<html>
<head>
  <title>Login Firebase</title>
</head>
<body>

<h2>Login con Google</h2>

<button id="login">Iniciar sesion con Google</button>

<p id="info"></p>

<button id="logout" style="display:none;">Cerrar sesión</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// 🔥 TU CONFIGURACIÓN DE FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyAX1XdAThaOEUDuH5PtHBps5iqGt4v3mZQ",
  authDomain: "clase-auth.firebaseapp.com",
  projectId: "clase-auth",
  storageBucket: "clase-auth.firebasestorage.app",
  messagingSenderId: "189316567260",
  appId: "1:189316567260:web:f90ad13dcabe0070292419"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

document.getElementById("login").onclick = async () => {
  const result = await signInWithPopup(auth, provider);
  const user = result.user;

  document.getElementById("info").innerText =
    "Bienvenido: " + user.displayName;
};

document.getElementById("logout").onclick = async () => {
  await signOut(auth);
};

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("info").innerText =
      "Sesion activa: " + user.displayName;

    document.getElementById("logout").style.display = "block";
  } else {
    document.getElementById("info").innerText =
      "No hay sesion activa";

    document.getElementById("logout").style.display = "none";
  }
});

</script>

</body>
</html>
